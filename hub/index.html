<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibe Coding Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Montserrat:wght@600;800;900&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/brand/km-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Singha KM · Vibe Coding Hub หน้าแรก">
        <span class="logo" aria-hidden="true">
          <svg class="logo-mark" viewBox="0 0 100 100">
            <path d="M0 0H100L51 50Z" fill="#bdbec0"/>
            <path d="M100 0V100L51 50Z" fill="#bd8e27"/>
            <path d="M0 0L51 50L100 100H0Z" fill="#ffde00"/>
          </svg>
          <span class="logo-word"><span class="logo-top">SINGHA</span><span class="logo-km">KM</span></span>
        </span>
        <span class="brand-sub"><small>AI Showcase</small><b>VIBE CODING HUB</b></span>
      </a>
      <div class="top-actions">
        <button class="icon-btn" id="top-search" type="button" aria-label="ค้นหา" data-icon="search"></button>
        <a class="icon-btn" href="#/saved" aria-label="ผลงานที่บันทึกไว้" data-icon="bookmark"><span class="dot" id="saved-count" hidden></span></a>
      </div>
    </div>
  </header>
  <div id="demo-banner" class="demo-banner" hidden>เว็บต้นแบบ · ผลงานทั้งหมดเป็นข้อมูลตัวอย่างสมมติ</div>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="หมวดหมู่"></nav>
    <main id="app"></main>
  </div>

  <a class="fab" href="#/submit"><span data-icon="pencil"></span>แชร์ผลงาน</a>
  <footer class="footer">KM-AI Vibe Code Hub · ผลงานทุกชิ้นผ่านการตรวจตาม KABAC และ Audit Checklist ก่อนเผยแพร่</footer>

  <script src="data/projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
