<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11162a"/><stop offset=".55" stop-color="#2e3358"/><stop offset="1" stop-color="#6b5a8e"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f7c600" stop-opacity=".4"/><stop offset="1" stop-color="#f7c600" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e1ee"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="860" cy="250" r="240" fill="url(#glow)"/>
  <!-- flight path -->
  <path d="M120 560 C 330 520, 420 330, 620 360 S 900 230, 1040 150" stroke="#f7c600" stroke-width="4" stroke-dasharray="2 16" stroke-linecap="round" fill="none"/>
  <!-- paper plane -->
  <g filter="url(#shadow)" transform="translate(990 95) rotate(-18)">
    <path d="M0 60 L170 0 L110 140 L80 92 Z" fill="#ffffff"/>
    <path d="M80 92 L170 0 L62 74 Z" fill="#d9d6ea"/>
    <path d="M80 92 L92 128 L110 140 Z" fill="#b9b4d4"/>
  </g>
  <!-- prompt cards -->
  <g filter="url(#shadow)" transform="rotate(-7 300 300)">
    <rect x="120" y="150" width="330" height="200" rx="18" fill="url(#card)"/>
    <rect x="148" y="178" width="70" height="22" rx="11" fill="#6b5a8e"/>
    <g fill="#8e8aa6"><rect x="148" y="220" width="270" height="11" rx="5.5"/><rect x="148" y="244" width="120" height="11" rx="5.5"/></g>
    <rect x="276" y="240" width="140" height="22" rx="6" fill="#f7c600" fill-opacity=".55"/>
    <text x="284" y="257" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#3d2f00">{customer}</text>
    <g fill="#8e8aa6"><rect x="148" y="280" width="250" height="11" rx="5.5"/><rect x="148" y="304" width="180" height="11" rx="5.5"/></g>
  </g>
  <g filter="url(#shadow)" transform="rotate(4 520 430)">
    <rect x="330" y="330" width="330" height="200" rx="18" fill="url(#card)"/>
    <rect x="358" y="358" width="90" height="22" rx="11" fill="#1d2d50"/>
    <g fill="#8e8aa6"><rect x="358" y="400" width="140" height="11" rx="5.5"/></g>
    <rect x="506" y="396" width="128" height="22" rx="6" fill="#f7c600" fill-opacity=".55"/>
    <text x="514" y="413" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#3d2f00">{product}</text>
    <g fill="#8e8aa6"><rect x="358" y="436" width="270" height="11" rx="5.5"/><rect x="358" y="460" width="230" height="11" rx="5.5"/><rect x="358" y="484" width="150" height="11" rx="5.5"/></g>
  </g>
  <!-- envelope -->
  <g filter="url(#shadow)">
    <rect x="720" y="300" width="300" height="200" rx="16" fill="#f7c600"/>
    <path d="M720 316 L870 420 L1020 316" stroke="#8a6400" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <path d="M720 490 L830 392 M1020 490 L910 392" stroke="#c99a00" stroke-width="5" fill="none"/>
    <circle cx="1010" cy="306" r="30" fill="#17663a"/>
    <path d="M995 306 l10 10 18 -20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#f7c600"><circle cx="90" cy="120" r="5"/><circle cx="640" cy="120" r="4"/><circle cx="1110" cy="560" r="6"/><circle cx="560" cy="600" r="3"/></g>
</svg>
