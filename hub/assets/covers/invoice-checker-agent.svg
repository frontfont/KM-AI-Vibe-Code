    <path d="M110 305 a110 34 0 0 0 220 0 M110 380 a110 34 0 0 0 220 0" stroke="#7fb2d8" stroke-opacity=".6" stroke-width="3" fill="none"/>
    <text x="220" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#cfe6f7" fill-opacity=".75">ERP</text>
  </g>
  <!-- connectors -->
  <g stroke="#5fe0b4" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round" fill="none">
    <path d="M335 320 C 410 320, 420 330, 495 330"/>
    <path d="M705 330 C 780 330, 790 300, 860 300"/>
  </g>
  <!-- robot agent -->
  <g filter="url(#shadow)">
