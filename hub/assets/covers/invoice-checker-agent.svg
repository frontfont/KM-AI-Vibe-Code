    <circle cx="600" cy="150" r="14" fill="#f7c600"/>
    <rect x="495" y="200" width="210" height="190" rx="46" fill="#e9f2ef"/>
    <rect x="525" y="240" width="150" height="90" rx="26" fill="#0f3534"/>
    <circle cx="565" cy="285" r="15" fill="#5fe0b4"/><circle cx="635" cy="285" r="15" fill="#5fe0b4"/>
    <path d="M575 355 q25 16 50 0" stroke="#0f3534" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="470" y="262" width="25" height="66" rx="10" fill="#bcd2cb"/><rect x="705" y="262" width="25" height="66" rx="10" fill="#bcd2cb"/>
  </g>
  <!-- invoice with flags -->
  <g filter="url(#shadow)" transform="rotate(-3 990 330)">
    <rect x="860" y="120" width="260" height="410" rx="14" fill="url(#paper)"/>
    <text x="890" y="170" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#0f3534">INVOICE</text>
    <g fill="#9fb0aa"><rect x="890" y="190" width="120" height="9" rx="4.5"/></g>
    <g>
      <rect x="884" y="228" width="212" height="34" rx="6" fill="#e4f5ea"/><rect x="896" y="240" width="110" height="10" rx="5" fill="#5c7068"/><path d="M1068 245 l6 6 12 -13" stroke="#17663a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="884" y="272" width="212" height="34" rx="6" fill="#e4f5ea"/><rect x="896" y="284" width="90" height="10" rx="5" fill="#5c7068"/><path d="M1068 289 l6 6 12 -13" stroke="#17663a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="884" y="316" width="212" height="34" rx="6" fill="#fde2c4" stroke="#e07b00" stroke-width="2"/><rect x="896" y="328" width="120" height="10" rx="5" fill="#5c7068"/>
      <path d="M1074 323 v18" stroke="#e07b00" stroke-width="4" stroke-linecap="round"/><circle cx="1074" cy="346" r="2.5" fill="#e07b00"/>
      <rect x="884" y="360" width="212" height="34" rx="6" fill="#e4f5ea"/><rect x="896" y="372" width="100" height="10" rx="5" fill="#5c7068"/><path d="M1068 377 l6 6 12 -13" stroke="#17663a" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <rect x="884" y="420" width="212" height="2" fill="#9fb0aa"/>
    <rect x="980" y="440" width="116" height="16" rx="8" fill="#0f3534"/>
    <rect x="884" y="476" width="120" height="30" rx="15" fill="#f7c600"/>
  </g>
  <!-- human approval -->
  <g filter="url(#shadow)">
    <circle cx="1030" cy="580" r="44" fill="#f7c600"/>
    <circle cx="1030" cy="566" r="13" fill="#1d2d50"/><path d="M1006 600 q24 -26 48 0" fill="#1d2d50"/>
