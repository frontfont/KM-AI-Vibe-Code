<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071716"/><stop offset=".5" stop-color="#0f3534"/><stop offset="1" stop-color="#256e5a"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5fe0b4" stop-opacity=".35"/><stop offset="1" stop-color="#5fe0b4" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8f7"/><stop offset="1" stop-color="#d3ddd9"/></linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d3a52"/><stop offset=".5" stop-color="#2f5878"/><stop offset="1" stop-color="#1d3a52"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="#5fe0b4" fill-opacity=".07"><circle cx="100" cy="100" r="3"/><circle cx="160" cy="100" r="3"/><circle cx="220" cy="100" r="3"/><circle cx="100" cy="160" r="3"/><circle cx="160" cy="160" r="3"/><circle cx="220" cy="160" r="3"/></g>
  <circle cx="600" cy="330" r="260" fill="url(#glow)"/>
  <!-- ERP database -->
  <g filter="url(#shadow)">
    <path d="M110 230 v220 a110 34 0 0 0 220 0 v-220z" fill="url(#db)"/>
