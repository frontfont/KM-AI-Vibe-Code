    <rect x="862" y="156" width="150" height="16" rx="8" fill="#3d2c06"/>
    <g fill="#a89b80"><rect x="862" y="190" width="200" height="9" rx="4.5"/><rect x="862" y="210" width="170" height="9" rx="4.5"/></g>
    <rect x="862" y="246" width="110" height="12" rx="6" fill="#c99a00"/>
    <g>
      <rect x="862" y="278" width="24" height="24" rx="6" fill="#17663a"/><path d="M868 290 l5 5 9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <rect x="898" y="285" width="170" height="10" rx="5" fill="#6d6250"/>
      <rect x="862" y="322" width="24" height="24" rx="6" fill="#17663a"/><path d="M868 334 l5 5 9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <rect x="898" y="329" width="140" height="10" rx="5" fill="#6d6250"/>
