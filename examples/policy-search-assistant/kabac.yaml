# ตัวอย่าง KABAC ที่กรอกครบ (อ้างอิงตัวอย่างจาก KABAC Manual)
kabac_version: "1.0"

meta:
  project: "Policy Search Assistant"
  slug: "policy-search-assistant"
  summary: "ผู้ช่วย AI ค้นหาและสรุปเงื่อนไขจากคู่มือ/นโยบายบริษัทให้พนักงานขาย"
  owner: "ทีม Sales Enablement"
  status: Proposed
  date: "2026-11-23"

business:
  problem_opportunity:
    - "ปัญหา: พนักงานเสียเวลาค้นหาเงื่อนไขในคู่มือ PDF เฉลี่ย 15 นาที/เคส"
    - "โอกาส: ใช้ AI ค้นหาและสรุปคำตอบจากเอกสารอัตโนมัติ"
  value_roi:
    - "สรุปข้อมูลได้ภายใน 30 วินาที ลดภาระงานแอดมิน 60%"
    - "เป้าหมาย: คืนทุน (Payback) ภายใน 4 เดือน"
  users_channels:
    - "Users: พนักงานขาย 5,000 คน"
    - "Channels: LINE OA และ Web Admin Portal"
  data_resources:
    - "คลังเอกสาร PDF, นโยบายบริษัท, ฐานข้อมูล CRM"
    - "ข้อมูลอัปเดตทุกสัปดาห์ ต้องการความแม่นยำสูง"
  cost_constraints:
    - "Cost: ค่า API Token, ค่า Cloud Server, ค่าดูแลระบบ"
    - "Constraints: ห้ามข้อมูลรั่วไหลออกนอกองค์กร (PDPA)"
  activities_adoption:
    - "จัดทำ Pipeline อัปเดตเอกสารอัตโนมัติ"
    - "ทดสอบกลุ่มย่อย (Pilot) และจัดเวิร์กชอปอบรมการใช้งาน"

adr:
  - id: ADR-01
    area: "Model & Knowledge Strategy"
    category: model_knowledge
    selected_architecture: "Commercial LLM API + RAG"
    rationale: "เอกสารเปลี่ยนทุกสัปดาห์ RAG อัปเดตความรู้ได้โดยไม่ต้อง fine-tune ทำให้ตอบได้ภายใน 30 วินาทีตามเป้า"
    links_to: [problem_opportunity, value_roi, data_resources]
    tradeoffs_mitigations: "ค่า Token แปรผันตามการใช้งาน → ตั้ง quota ต่อผู้ใช้และ cache คำถามที่พบบ่อย"
  - id: ADR-02
    area: "Infrastructure & Security"
    category: infrastructure_security
    selected_architecture: "Cloud VPC + Vector DB (private endpoint)"
    rationale: "ข้อมูลภายในห้ามออกนอกองค์กร จึงเก็บ embedding ใน VPC และเรียก LLM ผ่านสัญญา zero data retention"
    links_to: [cost_constraints]
    tradeoffs_mitigations: "ต้นทุน infra สูงกว่า SaaS → เริ่มที่ขนาดเล็กใน Pilot แล้วค่อย scale"
  - id: ADR-03
    area: "Accuracy & Guardrails"
    category: accuracy_guardrails
    selected_architecture: "ตอบพร้อมอ้างอิงหน้าเอกสาร + ปฏิเสธเมื่อไม่พบแหล่งอ้างอิง"
    rationale: "พนักงานขายต้องเชื่อถือคำตอบได้ การแสดงแหล่งอ้างอิงช่วยให้ตรวจสอบเองได้ทันที"
    links_to: [value_roi, activities_adoption]
    tradeoffs_mitigations: "บางคำถามจะได้คำตอบว่า 'ไม่พบข้อมูล' → เก็บ log คำถามเหล่านี้เพื่อเติมเอกสาร"

reuse:
  bu: "BU-Sales"
  company: "บริษัท ตัวอย่าง จำกัด"
  asset_types: [app, prompt]
  data_classification: confidential
  connects_internal_systems: true
  decision_impact: assistive
  ai_vendor_model: ["Claude API (zero data retention)"]
  reuse_level: reusable
  maintainer: "ทีม Sales Enablement"
  support: best_effort
  license: "Internal Group License"
  repo_url: "https://github.com/example-org/policy-search-assistant"
  tags: [rag, search, sales, line-oa]
