# เรียกใช้ audit กลางจาก KM-AI Vibe Code Hub ทุกครั้งที่ push / เปิด PR
name: vibe-audit
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: frontfont/km-ai-vibe-code/.github/workflows/vibe-audit.yml@main
    # The hub repo is private: add a repo/org secret HUB_READ_TOKEN
    # (fine-grained PAT, Contents: read-only on km-ai-vibe-code).
    secrets:
      hub_token: ${{ secrets.HUB_READ_TOKEN }}
